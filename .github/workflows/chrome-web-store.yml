name: Chrome Web Store release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and submit (for example, v2.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

env:
  CWS_EXTENSION_ID: fbpbdcfggnebbgfhdlopfbengnhdbanl
  CWS_PUBLISHER_ID: 8970b508-a2bc-4ad0-b16e-fa2d15142ecd
  GCP_SERVICE_ACCOUNT: rain-github-publisher@rain-chrome-web-store.iam.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/526200708155/locations/global/workloadIdentityPools/github-actions/providers/rain

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.release.outputs.package_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Match the tag to manifest.json
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $manifest = Get-Content -Raw -LiteralPath manifest.json | ConvertFrom-Json
          $expectedTag = "v$($manifest.version)"

          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag '$env:RELEASE_TAG' does not match manifest version '$expectedTag'."
          }

          "version=$($manifest.version)" >> $env:GITHUB_OUTPUT
          "package_name=RAIN-$($manifest.version).zip" >> $env:GITHUB_OUTPUT

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            node --check "$file"
          done

      - name: Run extension tests
        run: |
          node smoke.test.js
          node sidepanel.test.js

      - name: Build Web Store package
        shell: pwsh
        run: ./package.ps1 -OutputPath "dist/${{ steps.release.outputs.package_name }}"

      - name: Store package for publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-web-store-package
          path: dist/${{ steps.release.outputs.package_name }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Upload and submit for review
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: chrome-web-store
      url: https://chromewebstore.google.com/detail/rain/fbpbdcfggnebbgfhdlopfbengnhdbanl
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Download tested package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chrome-web-store-package
          path: dist

      - name: Authenticate to Google without a stored key
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false

      - name: Upload package and submit it for review
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
        run: |
          set -euo pipefail

          item="publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}"
          upload_url="https://chromewebstore.googleapis.com/upload/v2/${item}:upload"
          status_url="https://chromewebstore.googleapis.com/v2/${item}:fetchStatus"
          publish_url="https://chromewebstore.googleapis.com/v2/${item}:publish"

          upload_response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header "Content-Type: application/zip" \
            --data-binary "@dist/${PACKAGE_NAME}" \
            "${upload_url}")

          upload_state=$(jq --raw-output '.uploadState // empty' <<<"${upload_response}")
          uploaded_version=$(jq --raw-output '.crxVersion // empty' <<<"${upload_response}")
          echo "Chrome Web Store upload state: ${upload_state:-unknown}"

          if [[ -n "${uploaded_version}" && "${uploaded_version}" != "${{ needs.build.outputs.version }}" ]]; then
            echo "Uploaded version '${uploaded_version}' did not match the expected version '${{ needs.build.outputs.version }}'." >&2
            exit 1
          fi

          if [[ "${upload_state}" == "IN_PROGRESS" || "${upload_state}" == "UPLOAD_IN_PROGRESS" ]]; then
            for attempt in {1..30}; do
              sleep 10
              status_response=$(curl --fail-with-body --silent --show-error \
                --header "Authorization: Bearer ${ACCESS_TOKEN}" \
                "${status_url}")
              upload_state=$(jq --raw-output '.lastAsyncUploadState // empty' <<<"${status_response}")
              echo "Upload processing state (${attempt}/30): ${upload_state:-unknown}"

              if [[ "${upload_state}" != "IN_PROGRESS" && "${upload_state}" != "UPLOAD_IN_PROGRESS" ]]; then
                break
              fi
            done
          fi

          if [[ "${upload_state}" != "SUCCEEDED" && "${upload_state}" != "UPLOAD_SUCCESS" ]]; then
            echo "Package upload did not succeed. Final state: ${upload_state:-unknown}" >&2
            exit 1
          fi

          publish_response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${publish_url}")

          echo "Package submitted to the Chrome Web Store for review."
          jq . <<<"${publish_response}"
